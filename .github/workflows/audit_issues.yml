name: audit-issues
on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * *"   # daily 09:00 UTC (safety-net sweep, kept alongside the immediate trigger below)
  issues:
    types: [opened, edited]   # catch non-compliant issues immediately, not just on the next daily sweep
permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      issues: read
      contents: read
    steps:
      - name: Audit issue bodies for DoD + Acceptance
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            function hasRequired(body) {
              const b = (body || "");
              const hasDoD = /\b(Definition of Done|DoD)\b/i.test(b);
              const hasAcc = /\b(Acceptance Criteria|Acceptance)\b/i.test(b);
              return {hasDoD, hasAcc};
            }

            // Full-repo scan on every trigger (schedule, workflow_dispatch, and now issues
            // opened/edited) is intentional: at this repo's issue volume a complete re-scan is
            // cheap and it keeps the check simple/correct (no per-event-issue special-casing,
            // no risk of missing a stale issue that regressed via some other path). Revisit only
            // if issue count grows enough to make this slow.
            const issues = await github.paginate(
              github.rest.issues.listForRepo,
              { owner, repo, state: "all", per_page: 100 }
            );

            const missing = [];
            for (const it of issues) {
              if (it.pull_request) continue; // ignore PRs
              const {hasDoD, hasAcc} = hasRequired(it.body);
              if (!(hasDoD && hasAcc)) {
                missing.push({ number: it.number, title: it.title, hasDoD, hasAcc });
              }
            }

            core.info(`Scanned ${issues.length} issues (PRs ignored).`);
            if (missing.length) {
              core.setFailed(
                "Issues missing required sections:\n" +
                missing.map(m => `- #${m.number} | DoD=${m.hasDoD} | Acceptance=${m.hasAcc} | ${m.title}`).join("\n")
              );
            } else {
              core.info("OK: every issue contains DoD + Acceptance sections");
            }
