name: verify

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "Makefile"
      - "requirements-dev.txt"
      - "tools/**"
      - "tests/**"
      - "scripts/**"
      - "schemas/**"
      - "examples/**"
      - "ledger/**"
      - "mcp/**"
      - ".github/workflows/verify.yml"
  push:
    branches: [main]
    paths:
      - "Makefile"
      - "requirements-dev.txt"
      - "tools/**"
      - "tests/**"
      - "scripts/**"
      - "schemas/**"
      - "examples/**"
      - "ledger/**"
      - "mcp/**"
      - ".github/workflows/verify.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - name: Run repository verification
        run: make verify
