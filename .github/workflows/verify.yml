name: verify

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "Makefile"
      - "requirements-dev.txt"
      - "tools/**"
      - "tests/**"
      - "scripts/**"
      - "schemas/**"
      - "examples/**"
      - "ledger/**"
      - "mcp/**"
      - ".github/workflows/verify.yml"
  push:
    branches: [main]
    paths:
      - "Makefile"
      - "requirements-dev.txt"
      - "tools/**"
      - "tests/**"
      - "scripts/**"
      - "schemas/**"
      - "examples/**"
      - "ledger/**"
      - "mcp/**"
      - ".github/workflows/verify.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Run repository verification
        run: make verify
